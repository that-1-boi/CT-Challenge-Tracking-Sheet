<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges Track Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }
    .vertical-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    /* Portrait orientation styles - when height > width */
    @media (orientation: portrait) {
      .portrait\:overflow-y-auto {
        overflow-y: auto !important;
      }
      .portrait\:max-h-\[60vh\] {
        max-height: 60vh !important;
      }
    }
    /* Landscape orientation on small screens (phones horizontal) */
    @media (orientation: landscape) and (max-height: 500px) {
      .landscape-phone\:text-\[7px\] {
        font-size: 7px !important;
      }
      .landscape-phone\:text-\[8px\] {
        font-size: 8px !important;
      }
      .landscape-phone\:text-\[9px\] {
        font-size: 9px !important;
      }
      .landscape-phone\:text-xs {
        font-size: 0.75rem !important;
        line-height: 1rem !important;
      }
      .landscape-phone\:text-sm {
        font-size: 0.875rem !important;
        line-height: 1.25rem !important;
      }
      .landscape-phone\:p-0 {
        padding: 0 !important;
      }
      .landscape-phone\:p-0\.5 {
        padding: 2px !important;
      }
      .landscape-phone\:p-1 {
        padding: 4px !important;
      }
      .landscape-phone\:pr-4 {
        padding-right: 16px !important;
      }
      .landscape-phone\:w-4 {
        width: 16px !important;
      }
      .landscape-phone\:h-4 {
        height: 16px !important;
      }
      .landscape-phone\:max-h-\[75vh\] {
        max-height: 75vh !important;
      }
      .landscape-phone\:overflow-y-auto {
        overflow-y: auto !important;
      }
      .landscape-phone\:hidden {
        display: none !important;
      }
      .landscape-phone\:mb-1 {
        margin-bottom: 4px !important;
      }
      .landscape-phone\:mb-2 {
        margin-bottom: 8px !important;
      }
      .landscape-phone\:pb-1 {
        padding-bottom: 4px !important;
      }
      .landscape-phone\:gap-1 {
        gap: 4px !important;
      }
      .landscape-phone\:min-w-\[100px\] {
        min-width: 100px !important;
      }
      .landscape-phone\:max-w-\[80px\] {
        max-width: 80px !important;
      }
    }
  </style>
<script type="importmap">

  }
}

</head>

</html>
